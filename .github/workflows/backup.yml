# Every Sunday: encrypted off-site copy of users' trips, accounts and live trips, kept 90 days.
# Needs one repository secret, BACKUP_KEY (encrypts the file; keep a copy in your password manager).
# The server lets this job read its export because GitHub signs a token proving the request comes from this workflow on main.
name: Backup
on:
  schedule:
    - cron: '23 9 * * 0'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  id-token: write
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/scripts/backup.js
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: 'safar-backup-${{ github.run_number }}', path: backup/, retention-days: 90 }
      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({ ...context.repo, title: 'Weekly Safar backup failed', body: `The backup run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`, labels: ['monitor'] });
