# Builds the Safar Android app in the cloud (no Google Play upload).
# The result is an .apk you can install straight onto an Android phone (Settings may ask you to allow "install unknown apps").
name: Android build
on:
  push:
    branches: [main]
    paths: ['ios-app/**', 'index.html', 'img/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run sync-android
      - name: Build the Android app (installable test copy)
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Safar-Android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: Safar-Android, path: Safar-Android.apk, retention-days: 30 }
