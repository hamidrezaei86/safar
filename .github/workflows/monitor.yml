# Every hour: checks the outside services Safar depends on, the Safar server's free-plan usage,
# and new app crashes. Opens a GitHub issue (GitHub emails you) when something needs attention,
# and closes it again by itself once everything is back to normal.
name: Monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/monitor.js');
            await run({ github, context, core });
